<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<title>WiFiDrop</title>
<style>
  :root { --bg:#f4f5f8; --card:#fff; --text:#16181d; --muted:#6b7180; --line:#e2e4ea; --accent:#2f6bff; --bad:#d93a3a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111318; --card:#1b1e25; --text:#eceef3; --muted:#9097a6; --line:#2b2f39; --accent:#5b8cff; --bad:#ff6b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--text); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px; }
  h1 { margin:0 0 4px; font-size:24px; letter-spacing:-.02em; }
  p { margin:0 0 20px; color:var(--muted); font-size:15px; }
  input { width:100%; font:inherit; font-size:18px; letter-spacing:.06em; padding:12px 14px; border-radius:12px;
          border:1px solid var(--line); background:var(--bg); color:var(--text); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { width:100%; margin-top:12px; font:inherit; font-weight:600; padding:12px; border:0; border-radius:12px;
           background:var(--accent); color:#fff; cursor:pointer; }
  .bad { color:var(--bad); font-size:14px; margin:8px 0 0; display:none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>WiFiDrop</h1>
  <p>Enter the network key shown in the terminal on the computer running WiFiDrop.</p>
  <input name="key" placeholder="abcd-efgh-jkmn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus required>
  <div class="bad" id="bad">That key didn't match. Try again.</div>
  <button type="submit">Continue</button>
</form>
<script>
  if (location.search.includes('bad=1')) document.getElementById('bad').style.display = 'block';
</script>
</body>
</html>
